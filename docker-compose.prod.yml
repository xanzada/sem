services:
  sem:
    build: .
    container_name: sem-worker
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - /opt/sem/data:/app/data
    networks:
      - dokploy-network
    environment:
      AUTOSTART: ${AUTOSTART:-}
      SITE_URL: ${SITE_URL:-}
      SITE_USERNAME: ${SITE_USERNAME:-}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      TASK_TEXT: ${TASK_TEXT:-}
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-}
      CONFIRM_DELAY_MS: ${CONFIRM_DELAY_MS:-}
      MOUSE_MOVE_SEC: ${MOUSE_MOVE_SEC:-}
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-}
      SCHEDULE_FROM: ${SCHEDULE_FROM:-}
      SCHEDULE_TO: ${SCHEDULE_TO:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      PANEL_USER: ${PANEL_USER:-}
      PANEL_PASSWORD: ${PANEL_PASSWORD:-}
      NOVNC_PUBLIC_URL: ${NOVNC_PUBLIC_URL:-}
      TZ: ${TZ:-Asia/Almaty}
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.sem-web.rule=Host(`sem.aihub.software`)
      - traefik.http.routers.sem-web.entrypoints=web
      - traefik.http.routers.sem-web.middlewares=redirect-to-https@file
      - traefik.http.routers.sem-tls.rule=Host(`sem.aihub.software`)
      - traefik.http.routers.sem-tls.entrypoints=websecure
      - traefik.http.routers.sem-tls.tls.certresolver=letsencrypt
      - traefik.http.services.sem-svc.loadbalancer.server.port=8080

networks:
  dokploy-network:
    external: true
