services:
  sem:
    build: .
    container_name: sem-worker
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./data:/app/data
    networks:
      - dokploy-network
    environment:
      SEM_MODE: ${SEM_MODE:-}
      AUTOSTART: ${AUTOSTART:-}
      SITE_URL: ${SITE_URL:-}
      SITE_LIST_URL: ${SITE_LIST_URL:-}
      SITE_USERNAME: ${SITE_USERNAME:-}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      LOGIN_SELECTORS_JSON: ${LOGIN_SELECTORS_JSON:-}
      SELECTORS_JSON: ${SELECTORS_JSON:-}
      STEPS_JSON: ${STEPS_JSON:-}
      SPEED: ${SPEED:-}
      ACTION_DELAY_MS: ${ACTION_DELAY_MS:-}
      KEEPALIVE_SEC: ${KEEPALIVE_SEC:-}
      SECURITY_TIMEOUT_MIN: ${SECURITY_TIMEOUT_MIN:-}
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-}
      SCHEDULE_FROM: ${SCHEDULE_FROM:-}
      SCHEDULE_TO: ${SCHEDULE_TO:-}
      EVIDENCE_SHOTS: ${EVIDENCE_SHOTS:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      PANEL_USER: ${PANEL_USER:-}
      PANEL_PASSWORD: ${PANEL_PASSWORD:-}
      DEMO_USER: ${DEMO_USER:-}
      DEMO_PASS: ${DEMO_PASS:-}
      DEMO_SESSION_MINUTES: ${DEMO_SESSION_MINUTES:-}
      NOVNC_PUBLIC_URL: ${NOVNC_PUBLIC_URL:-}
      TZ: ${TZ:-Asia/Almaty}
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.sem-web.rule=Host(`sem.aihub.software`)
      - traefik.http.routers.sem-web.entrypoints=web
      - traefik.http.routers.sem-web.middlewares=redirect-to-https@file
      - traefik.http.routers.sem-tls.rule=Host(`sem.aihub.software`)
      - traefik.http.routers.sem-tls.entrypoints=websecure
      - traefik.http.routers.sem-tls.tls.certresolver=letsencrypt
      - traefik.http.services.sem-svc.loadbalancer.server.port=8080

networks:
  dokploy-network:
    external: true
